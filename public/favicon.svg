<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#321227" />
      <stop offset="100%" stop-color="#1a0918" />
    </linearGradient>
    <linearGradient id="cakeBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f48fb1" />
      <stop offset="100%" stop-color="#d81b60" />
    </linearGradient>
    <linearGradient id="cakeTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd1dc" />
      <stop offset="100%" stop-color="#f06292" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff6d00" />
      <stop offset="50%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fff3b0" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff99c8" />
      <stop offset="50%" stop-color="#ff5f9e" />
      <stop offset="100%" stop-color="#e9c46a" />
    </linearGradient>
  </defs>

  <!-- Soft Rounded Dark Background with Gold/Pink Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGlow)" stroke="#ff8fab" stroke-width="2" stroke-opacity="0.6" />

  <!-- Candle Glow -->
  <circle cx="32" cy="14" r="9" fill="#ffb703" opacity="0.28" />

  <!-- Candle Body -->
  <rect x="29.5" y="18" width="5" height="10" rx="1.5" fill="#fff0f5" stroke="#f48fb1" stroke-width="0.8" />
  <line x1="29.5" y1="21" x2="34.5" y2="23" stroke="#ff5f9e" stroke-width="1.2" />
  <line x1="29.5" y1="25" x2="34.5" y2="27" stroke="#ff5f9e" stroke-width="1.2" />

  <!-- Candle Wick & Flame -->
  <line x1="32" y1="16" x2="32" y2="18" stroke="#555" stroke-width="1.2" />
  <path d="M32 7 C28.5 11.5 28.5 15.5 32 16.5 C35.5 15.5 35.5 11.5 32 7 Z" fill="url(#flameGrad)" />
  <ellipse cx="32" cy="13.5" rx="1.3" ry="2" fill="#ffffff" opacity="0.9" />

  <!-- Top Cake Layer -->
  <rect x="17" y="27" width="30" height="12" rx="4" fill="url(#cakeTop)" />
  <!-- Cream Drips Top -->
  <path d="M17 30 C17 27.8 18.8 27 21 27 L43 27 C45.2 27 47 27.8 47 30 L47 31.5 C45.2 31.5 44.5 34 43 34 C41.5 34 41 31 39.5 31 C38 31 37.5 34.5 35.8 34.5 C34 34.5 33.5 31 32 31 C30.5 31 30 34.5 28.2 34.5 C26.5 34.5 26 31 24.5 31 C23 31 22.5 34 21 34 C19.5 34 18.8 31.5 17 31.5 Z" fill="#fffdfb" />

  <!-- Bottom Cake Layer -->
  <rect x="11" y="38" width="42" height="15" rx="5" fill="url(#cakeBottom)" />
  <!-- Cream Drips Bottom -->
  <path d="M11 41 C11 38.8 12.8 38 15 38 L49 38 C51.2 38 53 38.8 53 41 L53 43 C51 43 50 46 48.2 46 C46.4 46 45.8 42.5 44 42.5 C42.2 42.5 41.5 46.5 39.5 46.5 C37.5 46.5 36.8 42.5 35 42.5 C33.2 42.5 32.5 46 30.5 46 C28.5 46 27.8 42.5 26 42.5 C24.2 42.5 23.5 46.5 21.5 46.5 C19.5 46.5 18.8 42.5 17 42.5 C15.2 42.5 14.5 45.5 13 45.5 C11.8 45.5 11.5 43 11 43 Z" fill="#fffdfb" />

  <!-- Decorative Golden Dots & Heart on Cake -->
  <circle cx="20" cy="48.5" r="1.4" fill="#e9c46a" />
  <circle cx="44" cy="48.5" r="1.4" fill="#e9c46a" />
  <path d="M32 50.8 C32 50.8 28.5 48.3 28.5 46.4 C28.5 45.2 29.5 44.4 30.6 44.4 C31.3 44.4 31.8 44.8 32 45.3 C32.2 44.8 32.7 44.4 33.4 44.4 C34.5 44.4 35.5 45.2 35.5 46.4 C35.5 48.3 32 50.8 32 50.8 Z" fill="#fff0f5" />

  <!-- Cake Plate -->
  <rect x="7" y="52" width="50" height="4" rx="2" fill="#f8edeb" stroke="#e9c46a" stroke-width="0.8" />

  <!-- Cute Sparkling Butterfly Perching Near Top Right -->
  <g transform="translate(48, 15) rotate(18) scale(0.85)">
    <path d="M0 0 C-7 -8 -12 -3 -7 2 C-11 5 -6 10 0 4 Z" fill="url(#wingGrad)" />
    <path d="M0 0 C7 -8 12 -3 7 2 C11 5 6 10 0 4 Z" fill="url(#wingGrad)" />
    <line x1="0" y1="-3" x2="0" y2="6" stroke="#fffdfb" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <!-- Sparkle Top Left -->
  <path d="M15 11 L16.2 14.2 L19.4 15.4 L16.2 16.6 L15 19.8 L13.8 16.6 L10.6 15.4 L13.8 14.2 Z" fill="#e9c46a" />
</svg>
